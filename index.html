<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F31N FILES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a;--surface:#12122a;--surface2:#1a1a3a;--border:#2a2a5a;
  --green:#39ff14;--pink:#ff2d95;--cyan:#00f0ff;--yellow:#ffd700;
  --red:#ff3131;--orange:#ff8c00;--text:#e0e0ff;--dim:#6666aa;--black:#000;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.7;
  -webkit-font-smoothing:none;image-rendering:pixelated}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(57,255,20,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(57,255,20,.03) 1px,transparent 1px);background-size:32px 32px}
#app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 12px 80px}
.header{text-align:center;padding:24px 0 16px;border-bottom:3px solid var(--border);margin-bottom:20px;position:relative}
.header h1{font-size:22px;color:var(--green);
  text-shadow:3px 3px 0 var(--black),0 0 20px rgba(57,255,20,.4);
  letter-spacing:4px;animation:flicker 3s infinite;cursor:pointer;transition:color .1s}
.header h1:hover{color:var(--cyan);text-shadow:3px 3px 0 var(--black),0 0 24px rgba(0,240,255,.6)}
.header h1:active{transform:translate(2px,2px)}
@keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.8}}
.header .sub{font-size:7px;color:var(--dim);margin-top:8px;letter-spacing:2px}
.sync-dot{position:absolute;top:12px;right:0;font-size:7px;color:var(--yellow);display:flex;align-items:center;gap:6px}
.sync-dot::before{content:'';width:8px;height:8px;background:var(--yellow);border-radius:50%;animation:syncpulse .8s infinite}
@keyframes syncpulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.nav button{font-family:inherit;font-size:8px;padding:10px 12px;background:var(--surface);
  color:var(--dim);border:3px solid var(--border);box-shadow:4px 4px 0 var(--black);
  cursor:pointer;letter-spacing:1px;flex:1;min-width:70px}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:var(--green);color:var(--black);border-color:var(--green);
  box-shadow:4px 4px 0 var(--black),0 0 12px rgba(57,255,20,.5)}
.pixel-box{background:var(--surface);border:3px solid var(--border);box-shadow:6px 6px 0 var(--black);padding:16px;margin-bottom:14px}
.cache-badge{display:inline-block;font-size:7px;padding:3px 8px;margin-left:8px;
  background:rgba(255,215,0,.15);color:var(--yellow);border:2px solid rgba(255,215,0,.4);vertical-align:middle}
.roster-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  margin-bottom:8px;background:var(--surface);border:3px solid var(--border);
  box-shadow:4px 4px 0 var(--black);cursor:pointer;gap:10px}
.roster-item:hover{background:var(--surface2);border-color:var(--green);
  transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--black)}
.roster-item .left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.roster-item .roll{font-size:8px;color:var(--cyan);background:rgba(0,240,255,.1);
  padding:4px 8px;border:2px solid rgba(0,240,255,.3);white-space:nowrap}
.roster-item .name{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-item .right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rating-badge{font-size:12px;font-weight:bold;padding:6px 10px;border:3px solid;min-width:60px;text-align:center}
.rating-pos{color:var(--green);border-color:var(--green);background:rgba(57,255,20,.08)}
.rating-neg{color:var(--red);border-color:var(--red);background:rgba(255,49,49,.08)}
.rating-mid{color:var(--yellow);border-color:var(--yellow);background:rgba(255,215,0,.08)}
.kk-mini{font-size:7px;color:var(--dim)}
.detail-header{text-align:center;padding:20px;margin-bottom:14px}
.detail-header .big-name{font-size:16px;color:var(--green);margin-bottom:8px;text-shadow:2px 2px 0 var(--black)}
.detail-header .big-roll{font-size:10px;color:var(--cyan);margin-bottom:14px}
.detail-header .big-score{font-size:28px;font-weight:bold;margin:10px 0;display:inline-block}
.score-formula{font-size:7px;color:var(--dim);margin-top:6px;line-height:1.9}
.score-formula .pos{color:var(--green)}
.score-formula .neg{color:var(--red)}
@keyframes scorePop{
  0%{transform:scale(1);text-shadow:2px 2px 0 var(--black)}
  40%{transform:scale(1.5);text-shadow:3px 3px 0 var(--black),0 0 24px rgba(57,255,20,.9)}
  100%{transform:scale(1);text-shadow:2px 2px 0 var(--black)}
}
.big-score.updated{animation:scorePop .7s ease-out}
.criteria-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.criteria-card{padding:12px;border:3px solid var(--border);background:var(--surface);text-align:center}
.criteria-card.positive{border-color:rgba(57,255,20,.4)}
.criteria-card.negative{border-color:rgba(255,49,49,.4)}
.criteria-card .label{font-size:7px;color:var(--dim);margin-bottom:6px;letter-spacing:1px}
.criteria-card .value{font-size:18px}
.criteria-card.positive .value{color:var(--green)}
.criteria-card.negative .value{color:var(--red)}
.stars-display{font-size:12px;letter-spacing:2px;margin-top:4px}
.section-title{font-size:10px;color:var(--yellow);padding:8px 0;border-bottom:2px solid var(--border);margin-bottom:12px;letter-spacing:2px}
.eval-section{margin-bottom:18px}
.criterion-row{margin-bottom:14px;padding:10px;border:3px solid var(--border);background:var(--surface)}
.criterion-row.positive{border-left:6px solid var(--green)}
.criterion-row.negative{border-left:6px solid var(--red)}
.criterion-row .cr-label{font-size:8px;margin-bottom:8px;color:var(--text);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.criterion-row .cr-label .cr-hint{font-size:6px;color:var(--dim);text-align:right}
.star-input{display:flex;gap:6px}
.star-input span{font-size:22px;color:#333;cursor:pointer;user-select:none;line-height:1}
.star-input span.on{color:var(--yellow);text-shadow:0 0 8px rgba(255,215,0,.6)}
.star-input span:hover{transform:scale(1.2)}
.pixel-btn{font-family:inherit;font-size:9px;padding:12px 18px;background:var(--surface2);
  color:var(--text);border:3px solid var(--border);box-shadow:5px 5px 0 var(--black);
  cursor:pointer;letter-spacing:1px;display:inline-block;position:relative}
.pixel-btn:hover:not(:disabled){background:var(--border)}
.pixel-btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--black)}
.pixel-btn:disabled{opacity:.3;cursor:not-allowed}
.pixel-btn.green{background:var(--green);color:var(--black);border-color:var(--green)}
.pixel-btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.pixel-btn.cyan{background:var(--cyan);color:var(--black);border-color:var(--cyan)}
.pixel-btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.pixel-btn.yellow{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.pixel-btn.wide{width:100%;text-align:center}
.pixel-btn.loading{color:transparent!important;pointer-events:none}
.pixel-btn.loading::after{content:'';position:absolute;top:50%;left:50%;width:12px;height:12px;
  margin:-6px 0 0 -6px;border:3px solid var(--black);border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pixel-input,.pixel-textarea{font-family:inherit;font-size:9px;width:100%;padding:12px;
  background:var(--bg);color:var(--text);border:3px solid var(--border);outline:none;resize:vertical}
.pixel-textarea{min-height:70px}
.pixel-input:focus,.pixel-textarea:focus{border-color:var(--green)}
.entry-item{padding:10px;border:2px solid var(--border);margin-bottom:8px;background:var(--surface);font-size:8px}
.entry-item .entry-top{display:flex;justify-content:space-between;color:var(--dim);font-size:7px;margin-bottom:6px;flex-wrap:wrap;gap:4px}
.entry-item .entry-scores{display:flex;flex-wrap:wrap;gap:6px;font-size:7px}
.entry-item .entry-scores span{padding:2px 6px;border:2px solid var(--border)}
.lore-item{padding:12px;border:3px solid var(--border);margin-bottom:10px;background:var(--surface)}
.lore-item .lore-text{font-size:9px;margin-bottom:8px;color:var(--text);line-height:1.8}
.lore-item .lore-meta{display:flex;justify-content:space-between;align-items:center;font-size:7px;color:var(--dim);gap:8px;flex-wrap:wrap}
.lore-vote-btns{display:flex;gap:6px}
.lore-vote-btns button{font-family:inherit;font-size:7px;padding:4px 8px;
  border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.lore-vote-btns button:hover{background:var(--border)}
.lore-vote-btns .kiss-btn{color:var(--pink);border-color:rgba(255,45,149,.5)}
.lore-vote-btns .kick-btn{color:var(--orange);border-color:rgba(255,140,0,.5)}
.kisskick-row{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:8px}
.kisskick-row button{font-family:inherit;font-size:8px;padding:8px 12px;
  border:2px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.kisskick-row .kiss-btn{color:var(--pink);border-color:rgba(255,45,149,.5)}
.kisskick-row .kick-btn{color:var(--orange);border-color:rgba(255,140,0,.5)}

/* ---- LORE FEED ---- */
.lore-composer{background:var(--surface);border:3px solid var(--border);
  box-shadow:4px 4px 0 var(--black);padding:12px;margin-bottom:16px}
.lore-composer select,.lore-composer textarea{font-family:inherit;font-size:8px;padding:8px;
  background:var(--bg);color:var(--text);border:2px solid var(--border);outline:none}
.lore-composer select{width:100%;margin-bottom:8px;cursor:pointer}
.lore-composer select:focus,.lore-composer textarea:focus{border-color:var(--green)}
.lore-composer textarea{width:100%;min-height:50px;resize:vertical;margin-bottom:8px}
.lore-composer .lc-btn{font-family:inherit;font-size:8px;padding:8px 14px;
  background:var(--cyan);color:var(--black);border:2px solid var(--cyan);cursor:pointer;
  box-shadow:3px 3px 0 var(--black);letter-spacing:1px;white-space:nowrap}
.lore-composer .lc-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black)}
.lore-composer .lc-btn:disabled{opacity:.4;cursor:not-allowed}
.lore-composer .lc-hint{font-size:6px;color:var(--dim);letter-spacing:1px;margin-top:6px}
.lore-feed{display:flex;flex-direction:column;gap:10px}
.lore-post{display:flex;gap:10px;background:var(--surface);border:3px solid var(--border);
  box-shadow:4px 4px 0 var(--black);padding:10px;align-items:flex-start}
.lore-post.top1{border-color:rgba(255,215,0,.6)}
.lore-post.top2{border-color:rgba(192,192,192,.5)}
.lore-post.top3{border-color:rgba(205,127,50,.5)}
.lp-vote{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;flex-shrink:0}
.lp-vote button{font-family:inherit;font-size:14px;padding:2px 6px;
  border:2px solid var(--border);background:var(--surface2);color:var(--dim);cursor:pointer;line-height:1}
.lp-vote button.up:hover{color:var(--pink);border-color:var(--pink)}
.lp-vote button.down:hover{color:var(--orange);border-color:var(--orange)}
.lp-vote .lp-score{font-size:11px;font-weight:bold;padding:2px 4px}
.lp-vote .lp-score.pos{color:var(--green)}
.lp-vote .lp-score.neg{color:var(--red)}
.lp-vote .lp-score.zero{color:var(--dim)}
.lp-body{flex:1;min-width:0}
.lp-text{font-size:9px;color:var(--text);line-height:1.8;margin-bottom:8px;word-break:break-word}
.lp-meta{display:flex;justify-content:space-between;gap:8px;font-size:7px;color:var(--dim);flex-wrap:wrap}
.lp-author{color:var(--cyan);cursor:pointer}
.lp-author:hover{color:var(--green)}
.lp-counts{color:var(--dim)}
.lore-sort-bar{display:flex;justify-content:space-between;align-items:center;font-size:7px;
  color:var(--dim);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--border)}

/* leaderboard */
.lb-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.lb-tabs button{font-family:inherit;font-size:8px;padding:9px 12px;background:var(--surface);
  color:var(--dim);border:3px solid var(--border);box-shadow:3px 3px 0 var(--black);cursor:pointer;flex:1;min-width:75px}
.lb-tabs button.active{background:var(--yellow);color:var(--black);border-color:var(--yellow)}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:6px;
  background:var(--surface);border:3px solid var(--border);box-shadow:3px 3px 0 var(--black);cursor:pointer}
.lb-row:hover{background:var(--surface2);border-color:var(--green)}
.lb-rank{font-size:14px;min-width:36px;text-align:center;color:var(--yellow);text-shadow:2px 2px 0 var(--black)}
.lb-rank.gold{color:var(--yellow)}.lb-rank.silver{color:#c0c0c0}.lb-rank.bronze{color:#cd7f32}
.lb-name{flex:1;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-roll{font-size:7px;color:var(--cyan);margin-right:8px}
.lb-value{font-size:12px;font-weight:bold}
.lb-value.pos{color:var(--green)}.lb-value.neg{color:var(--red)}.lb-value.mid{color:var(--yellow)}
.lb-value.kiss{color:var(--pink)}.lb-value.kick{color:var(--orange)}

/* swipe */
.swipe-container{position:relative;height:520px;display:flex;align-items:center;justify-content:center;touch-action:none}
.swipe-card{position:absolute;width:100%;max-width:380px;background:var(--surface);
  border:4px solid var(--border);box-shadow:8px 8px 0 var(--black);padding:22px;
  text-align:center;cursor:grab;user-select:none;contain:layout paint style;
  will-change:transform,opacity;backface-visibility:hidden}
.swipe-card:active{cursor:grabbing}
.swipe-card .sc-name{font-size:16px;color:var(--green);margin-bottom:6px;text-shadow:2px 2px 0 var(--black)}
.swipe-card .sc-roll{font-size:9px;color:var(--cyan);margin-bottom:14px}
.swipe-card .sc-score{font-size:30px;font-weight:bold;margin:12px 0}
.swipe-card .sc-kk{display:flex;justify-content:center;gap:16px;margin:12px 0;font-size:9px;color:var(--dim)}
.swipe-card .sc-criteria{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;text-align:left}
.swipe-card .sc-criteria .sc-crit{font-size:7px;padding:6px 8px;border:2px solid var(--border);display:flex;justify-content:space-between}
.swipe-overlay{position:absolute;top:20px;font-size:24px;font-weight:bold;padding:8px 16px;
  border:4px solid;opacity:0;pointer-events:none;z-index:10;letter-spacing:4px}
.swipe-overlay.kiss{right:20px;color:var(--pink);border-color:var(--pink);transform:rotate(12deg)}
.swipe-overlay.kick{left:20px;color:var(--orange);border-color:var(--orange);transform:rotate(-12deg)}
.swipe-hint{text-align:center;font-size:7px;color:var(--dim);margin-top:12px}
.swipe-actions{display:flex;justify-content:center;gap:16px;margin-top:16px}
.swipe-actions button{font-family:inherit;font-size:10px;padding:14px 22px;border:3px solid;
  box-shadow:5px 5px 0 var(--black);cursor:pointer;letter-spacing:2px}
.swipe-actions button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--black)}

/* submit overlay */
#submitOverlay{position:fixed;inset:0;background:rgba(10,10,26,.92);display:none;
  align-items:center;justify-content:center;z-index:9998;flex-direction:column;gap:20px}
#submitOverlay.show{display:flex}
#submitOverlay .ovr-title{font-size:12px;color:var(--green);letter-spacing:3px;animation:blink 1s infinite}
#submitOverlay .ovr-bar{width:240px;height:14px;background:var(--surface);
  border:3px solid var(--border);box-shadow:4px 4px 0 var(--black);overflow:hidden}
#submitOverlay .ovr-bar > div{height:100%;width:30%;background:var(--green);animation:barSlide 1.1s ease-in-out infinite}
@keyframes barSlide{0%{margin-left:-30%}100%{margin-left:100%}}
#submitOverlay .ovr-sub{font-size:7px;color:var(--dim);letter-spacing:1px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--green);color:var(--black);font-size:9px;padding:14px 24px;
  border:3px solid var(--black);box-shadow:6px 6px 0 rgba(0,0,0,.5);z-index:10000;
  opacity:0;transition:all .2s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.error{background:var(--red);color:#fff}
.loading{text-align:center;padding:60px 20px;color:var(--dim);font-size:10px}
.loading .blink{animation:blink .8s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:9px;line-height:2}
@media (max-width:500px){
  .header h1{font-size:16px;letter-spacing:2px}
  .criteria-grid{grid-template-columns:1fr}
  .roster-item .name{font-size:8px}
  .swipe-card{max-width:92%;padding:16px}
  .swipe-card .sc-name{font-size:13px}
  .swipe-card .sc-score{font-size:24px}
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <h1 id="brand">F31N FILES</h1>
    <div class="sub">// CLASSIFIED // RATE // KISS // KICK //</div>
    <div id="syncIndicator"></div>
  </div>
  <div class="nav" id="nav">
    <button data-tab="roster" class="active">ROSTER</button>
    <button data-tab="lore">LORE</button>
    <button data-tab="leaderboard">BOARD</button>
    <button data-tab="swipe">SWIPE</button>
  </div>
  <div id="content"></div>
</div>

<div id="toast"></div>
<div id="submitOverlay">
  <div class="ovr-title">◤ PROCESSING EVALUATION ◢</div>
  <div class="ovr-bar"><div></div></div>
  <div class="ovr-sub">UPLOADING AND RECALCULATING RATING...</div>
</div>

<script>
// ============================================================
// F31N FILES — Frontend v5 (final)
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxYQgcFPxAj1U1Hsi53Y9Ylueg5xLSIu-RSW6qApv8yx-jGAxXbagaFW8wdMhzlhEY1NQ/exec';

const CK = 'f31n_';
const TTL_ROSTER = 10 * 60 * 1000;
const TTL_DETAIL = 2 * 60 * 1000;
const TTL_LEADER = 5 * 60 * 1000;
const TTL_LORE   = 3 * 60 * 1000;

let STATE = {
  students: [],
  leaderboard: null,
  lbTab: 'topRated',
  loreFeed: [],
  loreComposerRoll: '',
  currentTab: 'roster',
  currentStudent: null,
  currentDetail: null,
  detailError: null,
  loading: true,
  loadingStart: null,
  status: '',
  error: null,
  fromCache: false,
  syncing: false,
  swipeOrder: [],
  swipeIndex: 0,
  rosterPage: 0,
  rosterPageSize: 30,
  rosterQuery: ''
};

// ---------- LOCAL CACHE ----------
function cWrite(key, data) {
  try { localStorage.setItem(CK + key, JSON.stringify({ t: Date.now(), d: data })); } catch(_){}
}
function cRead(key, maxAge) {
  try {
    const raw = localStorage.getItem(CK + key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.t) return null;
    if (maxAge && Date.now() - o.t > maxAge) return null;
    return o.d;
  } catch(_){ return null; }
}
function cClear() {
  try {
    Object.keys(localStorage).filter(k => k.startsWith(CK)).forEach(k => localStorage.removeItem(k));
  } catch(_){}
}

// ---------- API ----------
async function api(action, params = {}, timeoutMs = 25000) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null) url.searchParams.set(k, String(v));
  });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const t0 = Date.now();
  try {
    const res = await fetch(url.toString(), {
      method: 'GET', signal: ctrl.signal, redirect: 'follow', cache: 'no-store'
    });
    clearTimeout(timer);
    const txt = await res.text();
    console.log(`[F31N] ${action} ${res.status} ${Date.now() - t0}ms ${txt.length}b`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    try { return JSON.parse(txt); } catch { throw new Error('Bad JSON: ' + txt.slice(0, 100)); }
  } catch (err) {
    clearTimeout(timer);
    console.error(`[F31N FAIL] ${action} ${Date.now() - t0}ms`, err);
    throw err;
  }
}

// ---------- BOOT ----------
async function boot() {
  const cachedRoster = cRead('roster', TTL_ROSTER);
  const cachedLeader = cRead('leader', TTL_LEADER);
  const cachedLore   = cRead('lore', TTL_LORE);

  if (Array.isArray(cachedRoster) && cachedRoster.length) {
    console.log('[F31N] instant boot from cache');
    STATE.students = cachedRoster;
    if (cachedLeader) STATE.leaderboard = cachedLeader;
    if (Array.isArray(cachedLore)) STATE.loreFeed = cachedLore;
    STATE.swipeOrder = shuffle([...cachedRoster]);
    STATE.swipeIndex = 0;
    STATE.loading = false;
    STATE.fromCache = true;
    render();
    backgroundRefresh();
    return;
  }

  STATE.loading = true;
  STATE.loadingStart = Date.now();
  STATE.status = 'CONNECTING...';
  render();

  try {
    const lb = await api('leaderboard');
    if (lb && !lb.error) { STATE.leaderboard = lb; cWrite('leader', lb); }
  } catch(_){}

  await loadRoster();
  loadLore();
}

async function loadRoster() {
  STATE.status = 'FETCHING ROSTER...';
  render();
  try {
    const data = await api('roster');
    if (data && data.error) throw new Error(data.error);
    if (!Array.isArray(data)) throw new Error('Bad payload');
    STATE.students = data;
    STATE.swipeOrder = shuffle([...data]);
    STATE.swipeIndex = 0;
    STATE.fromCache = false;
    STATE.error = null;
    cWrite('roster', data);
  } catch (err) {
    STATE.error = err.message || String(err);
  }
  STATE.loading = false;
  STATE.rosterPage = 0;
  render();
}

async function backgroundRefresh() {
  if (STATE.syncing) return;
  STATE.syncing = true;
  renderSync();
  try {
    const [roster, lb, lore] = await Promise.all([
      api('roster').catch(() => null),
      api('leaderboard').catch(() => null),
      api('alllore').catch(() => null)
    ]);
    if (Array.isArray(roster) && roster.length) {
      const byRoll = {}; roster.forEach(s => byRoll[s.roll] = s);
      const seen = new Set();
      const newOrder = [];
      STATE.swipeOrder.forEach(s => {
        if (byRoll[s.roll]) { newOrder.push(byRoll[s.roll]); seen.add(s.roll); }
      });
      roster.forEach(s => { if (!seen.has(s.roll)) newOrder.push(s); });
      STATE.swipeOrder = newOrder;
      STATE.students = roster;
      STATE.fromCache = false;
      cWrite('roster', roster);
    }
    if (lb && !lb.error) { STATE.leaderboard = lb; cWrite('leader', lb); }
    if (Array.isArray(lore)) { STATE.loreFeed = lore; cWrite('lore', lore); }
  } catch(_){}
  STATE.syncing = false;
  renderSync();
  render();
}

function renderSync() {
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  el.className = STATE.syncing ? 'sync-dot' : '';
  el.textContent = STATE.syncing ? 'SYNCING' : '';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- RENDER ----------
function render() {
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === STATE.currentTab);
  });
  const content = document.getElementById('content');

  if (STATE.loading) {
    const secs = STATE.loadingStart ? Math.floor((Date.now() - STATE.loadingStart) / 1000) : 0;
    content.innerHTML = `
      <div class="loading">
        <div><span class="blink">▮</span> ${STATE.status || 'LOADING...'}</div>
        <div style="margin-top:16px;font-size:9px;color:var(--yellow);">${secs}s</div>
        <div style="margin-top:16px;font-size:7px;color:var(--dim);line-height:2;">
          First load can take 15–25s (cold start).<br>
          After that, everything is cached and instant.
        </div>
      </div>`;
    clearTimeout(window._tick);
    window._tick = setTimeout(render, 1000);
    return;
  }

  if (STATE.error && !STATE.students.length) {
    content.innerHTML = `
      <div class="pixel-box" style="text-align:center;padding:30px;">
        <div style="font-size:14px;color:var(--red);margin-bottom:12px;">⚠ CONNECTION FAILED</div>
        <div style="font-size:8px;color:var(--text);margin-bottom:16px;line-height:2;word-break:break-word;">${esc(STATE.error)}</div>
        <button class="pixel-btn green" onclick="loadRoster()">▶ RETRY</button>
        <button class="pixel-btn" onclick="hardReset()" style="margin-left:8px;">↻ CLEAR CACHE</button>
      </div>`;
    return;
  }

  if (STATE.currentTab === 'roster') {
    if (STATE.currentStudent) renderDetail(content);
    else renderRoster(content);
  } else if (STATE.currentTab === 'lore') {
    renderLore(content);
  } else if (STATE.currentTab === 'leaderboard') {
    renderLeaderboard(content);
  } else if (STATE.currentTab === 'swipe') {
    renderSwipe(content);
  }
}

function hardReset() {
  cClear();
  STATE.students = []; STATE.swipeOrder = []; STATE.swipeIndex = 0;
  STATE.leaderboard = null; STATE.loreFeed = []; STATE.error = null;
  STATE.loading = true; STATE.loadingStart = Date.now(); STATE.status = 'CONNECTING...';
  render();
  boot();
}

function goHome() {
  STATE.currentTab = 'roster';
  STATE.currentStudent = null;
  STATE.currentDetail = null;
  STATE.detailError = null;
  STATE.rosterQuery = '';
  STATE.rosterPage = 0;
  STATE.error = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  backgroundRefresh();
}

// ---------- ROSTER ----------
function renderRoster(el) {
  if (!STATE.students.length) {
    el.innerHTML = `<div class="empty">NO STUDENTS FOUND.</div>`;
    return;
  }
  const q = STATE.rosterQuery.trim().toLowerCase();
  const filtered = q
    ? STATE.students.filter(s => s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q))
    : STATE.students;

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / STATE.rosterPageSize));
  if (STATE.rosterPage >= totalPages) STATE.rosterPage = totalPages - 1;
  const start = STATE.rosterPage * STATE.rosterPageSize;
  const items = filtered.slice(start, start + STATE.rosterPageSize);

  const badge = STATE.fromCache ? '<span class="cache-badge">CACHED</span>' : '';

  let html = `
    <div style="margin-bottom:12px;">
      <input class="pixel-input" id="rosterSearch" placeholder="SEARCH NAME OR ROLL..."
             value="${esc(STATE.rosterQuery)}" oninput="onRosterSearch(this.value)">
    </div>
    <div style="display:flex;justify-content:space-between;font-size:7px;color:var(--dim);margin-bottom:10px;">
      <span>● ${total} RECORD${total !== 1 ? 'S' : ''} ${badge}</span>
      <span>PAGE ${STATE.rosterPage + 1} / ${totalPages}</span>
    </div>`;

  if (!items.length) {
    html += `<div class="empty">NO MATCHES FOR "${esc(STATE.rosterQuery)}"</div>`;
    el.innerHTML = html;
    return;
  }

  items.forEach(s => {
    const cls = s.rating > 3 ? 'rating-pos' : s.rating < 2 ? 'rating-neg' : 'rating-mid';
    html += `
      <div class="roster-item" onclick="openDetail('${s.roll}')">
        <div class="left">
          <span class="roll">${esc(s.roll)}</span>
          <span class="name">${esc(s.name)}</span>
        </div>
        <div class="right">
          <div class="kk-mini">♥${s.kisses} ✖${s.kicks}</div>
          <div class="rating-badge ${cls}">${s.rating.toFixed(2)}</div>
        </div>
      </div>`;
  });

  if (totalPages > 1) {
    html += `
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="pixel-btn" style="flex:1;" ${STATE.rosterPage === 0 ? 'disabled' : ''}
                onclick="rosterPage(-1)">← PREV</button>
        <button class="pixel-btn" style="flex:1;" ${STATE.rosterPage >= totalPages - 1 ? 'disabled' : ''}
                onclick="rosterPage(1)">NEXT →</button>
      </div>`;
  }
  el.innerHTML = html;
}

let _searchTimer;
function onRosterSearch(val) {
  STATE.rosterQuery = val;
  STATE.rosterPage = 0;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    const active = document.activeElement;
    const wasSearch = active && active.id === 'rosterSearch';
    const pos = wasSearch ? active.selectionStart : 0;
    render();
    if (wasSearch) {
      const inp = document.getElementById('rosterSearch');
      if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    }
  }, 120);
}
function rosterPage(d) { STATE.rosterPage += d; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// ---------- LORE ----------
function loadLore() {

  if (Array.isArray(cached)) {
    STATE.loreFeed = cached;
    if (STATE.currentTab === 'lore') render();
  }
  api('alllore').then(data => {
    if (Array.isArray(data)) {
      STATE.loreFeed = data;
      cWrite('lore', data);
      if (STATE.currentTab === 'lore') render();
    }
  }).catch(() => {});
}

function renderLore(el) {
  const rollOpts = STATE.students.map(s =>
    `<option value="${esc(s.roll)}" ${STATE.loreComposerRoll === s.roll ? 'selected' : ''}>${esc(s.roll)} — ${esc(s.name)}</option>`
  ).join('');

  let html = `
    <div class="lore-composer">
      <select id="loreRoll" onchange="STATE.loreComposerRoll=this.value">
        <option value="">— PICK A STUDENT —</option>
        ${rollOpts}
      </select>
      <textarea id="loreComposerText" placeholder="DROP SOME LORE..."></textarea>
      <button class="lc-btn" onclick="submitLorePost()">+ POST LORE</button>

    </div>
    <div class="lore-sort-bar">
      <span>● ${STATE.loreFeed.length} POST${STATE.loreFeed.length !== 1 ? 'S' : ''}</span>
      <span>SORTED BY SCORE</span>
    </div>
    <div class="lore-feed">
  `;

  if (!STATE.loreFeed.length) {
    html += `<div class="empty">NO LORE POSTS YET.<br><br>Be the first to drop one.</div>`;
  } else {
    STATE.loreFeed.forEach((l, i) => {
      const scoreCls = l.score > 0 ? 'pos' : l.score < 0 ? 'neg' : 'zero';
      const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const scoreTxt = l.score > 0 ? '+' + l.score : String(l.score);

      html += `
        <div class="lore-post ${rankCls}">
          <div class="lp-vote">
            <button class="up" onclick="voteLoreFeed('${l.id}','kiss')">♥</button>

            <button class="down" onclick="voteLoreFeed('${l.id}','kick')">✖</button>
          </div>

            <div class="lp-text">"${esc(l.text)}"</div>
            <div class="lp-meta">
              <span class="lp-author" onclick="openDetailFromLore('${esc(l.roll)}')">${esc(l.roll)} · ${esc(l.name)}</span>
              <span class="lp-counts">♥ ${l.kiss} &nbsp; ✖ ${l.kick}</span>
            </div>
          </div>
        </div>`;
    });
  }

  html += `</div>`;
  el.innerHTML = html;
}

async function submitLorePost() {
  const roll = document.getElementById('loreRoll').value;
  const text = document.getElementById('loreComposerText').value.trim();

  if (!roll) { toast('PICK A STUDENT FIRST', true); return; }
  if (!text) { toast('WRITE SOMETHING FIRST', true); return; }

  const student = STATE.students.find(s => s.roll === roll);
  const name = student ? student.name : '';

  const btn = document.querySelector('.lore-composer .lc-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'POSTING...'; }

  try {
    const res = await api('addlore', { roll, name, text }, 20000);
    if (res.error) throw new Error(res.error);

    document.getElementById('loreComposerText').value = '';

    const newPost = {
      id: res.id, roll: roll, name: name, text: text,
      kiss: 0, kick: 0, score: 0
    };
    STATE.loreFeed = [newPost, ...STATE.loreFeed];
    cWrite('lore', STATE.loreFeed);
    try { localStorage.removeItem(CK + 'detail_' + roll); } catch(_){}

    toast('LORE POSTED');
    render();
  } catch (err) {
    toast('FAILED: ' + err.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '+ POST LORE'; }
  }
}

async function voteLoreFeed(loreId, vote) {
  const post = STATE.loreFeed.find(p => p.id === loreId);
  if (post) {
    if (vote === 'kiss') post.kiss++;
    else                 post.kick++;
    post.score = post.kiss - post.kick;
    STATE.loreFeed.sort((a, b) => b.score - a.score);
    cWrite('lore', STATE.loreFeed);
    render();
  }

  try {
    const res = await api('voteLore', { loreId, vote });
    if (res.error) throw new Error(res.error);
    toast(vote === 'kiss' ? '♥ KISSED' : '✖ KICKED');
  } catch (err) {
    if (post) {
      if (vote === 'kiss') post.kiss--;
      else                 post.kick--;
      post.score = post.kiss - post.kick;
      STATE.loreFeed.sort((a, b) => b.score - a.score);
      cWrite('lore', STATE.loreFeed);
      render();
    }
    toast('FAILED: ' + err.message, true);
  }
}

function openDetailFromLore(roll) {

  openDetail(roll);
}

    api('leaderboard').then(x => {

  const tabs = [
    { k: 'topRated',   label: 'TOP RATED' },
    { k: 'mostEval',   label: 'MOST RATED' },
    { k: 'mostKissed', label: 'MOST KISSED' },

    <div class="lb-tabs">
      ${tabs.map(t => `<button class="${STATE.lbTab === t.k ? 'active' : ''}" onclick="setLbTab('${t.k}')">${t.label}</button>`).join('')}

  list.forEach((s, i) => {

    let valueHtml;
    if (STATE.lbTab === 'topRated') {
      const c = s.rating > 3 ? 'pos' : s.rating < 2 ? 'neg' : 'mid';
      valueHtml = `<span class="lb-value ${c}">${s.rating.toFixed(2)}</span>`;
    } else if (STATE.lbTab === 'mostEval') {
      valueHtml = `<span class="lb-value mid">${s.evalCount}×</span>`;
    } else if (STATE.lbTab === 'mostKissed') {
      valueHtml = `<span class="lb-value kiss">♥ ${s.kisses}</span>`;
    } else {
      valueHtml = `<span class="lb-value kick">✖ ${s.kicks}</span>`;
    }

    html += `
      <div class="lb-row" onclick="openDetail('${s.roll}')">
        <div class="lb-rank ${rankCls}">#${rank}</div>
        <div class="lb-name"><span class="lb-roll">${esc(s.roll)}</span>${esc(s.name)}</div>
        ${valueHtml}
      </div>`;
  });

  el.innerHTML = html;
}

function setLbTab(k) { STATE.lbTab = k; render(); }

// ---------- DETAIL ----------
async function openDetail(roll) {
  STATE.currentStudent = roll;
  STATE.currentDetail = null;
  STATE.detailError = null;
  render();

  const cached = cRead('detail_' + roll, TTL_DETAIL);
  if (cached && cached.student) {
    STATE.currentDetail = cached;
    render();
    api('detail', { roll }).then(fresh => {
      if (fresh && fresh.student) {
        STATE.currentDetail = fresh;
        cWrite('detail_' + roll, fresh);
        render();
      }
    }).catch(() => {});
    return;
  }

  try {
    const d = await api('detail', { roll });
    if (!d || d.error) throw new Error(d?.error || 'No data');
    STATE.currentDetail = d;
    cWrite('detail_' + roll, d);
  } catch (err) {
    STATE.detailError = err.message || String(err);
  }
  render();
}

function closeDetail() {
  STATE.currentStudent = null;
  STATE.currentDetail = null;
  STATE.detailError = null;
  render();
}

function critCard(label, value, positive) {
  return `
    <div class="criteria-card ${positive ? 'positive' : 'negative'}">
      <div class="label">${label}</div>
      <div class="value">${value.toFixed(1)}</div>
      <div class="stars-display">${stars(value, positive ? 'var(--green)' : 'var(--red)')}</div>
    </div>`;
}

function criteriaRow(label, key, positive) {
  return `
    <div class="criterion-row ${positive ? 'positive' : 'negative'}">
      <div class="cr-label">
        <span>${positive ? '▲' : '▼'} ${label.toUpperCase()}</span>
        <span class="cr-hint">${positive ? '1-5 STARS' : '1→0  2→−0.5  3→−1  4→−2  5→−3'}</span>
      </div>
      <div class="star-input" data-target="${key}">
        <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span>
        <span data-val="4">★</span><span data-val="5">★</span>
      </div>
    </div>`;
}

function stars(v, color) {
  const f = Math.round(v);
  let o = '';
  for (let i = 1; i <= 5; i++) o += `<span style="color:${i <= f ? color : '#333'}">★</span>`;
  return o;
}

function entryItem(e) {
  const cls = e.score > 3 ? 'var(--green)' : e.score < 2 ? 'var(--red)' : 'var(--yellow)';
  return `
    <div class="entry-item">
      <div class="entry-top">
        <span>${formatDate(e.time)}</span>
        <span style="color:${cls};font-size:10px;">SCORE: ${e.score.toFixed(2)}</span>
      </div>
      <div class="entry-scores">
        <span style="color:var(--green)">P:${e.personality}</span>
        <span style="color:var(--green)">C:${e.cool}</span>
        <span style="color:var(--green)">H:${e.helpfulness}</span>
        <span style="color:var(--red)">Pe:${e.pettiness}</span>
        <span style="color:var(--red)">Ha:${e.hate}</span>
        <span style="color:var(--red)">An:${e.annoying}</span>
      </div>
      ${e.lore ? `<div style="margin-top:6px;color:var(--dim);font-size:7px;">"${esc(e.lore)}"</div>` : ''}
    </div>`;
}

function loreItem(l) {
  return `
    <div class="lore-item">
      <div class="lore-text">"${esc(l.text)}"</div>
      <div class="lore-meta">
        <span>${formatDate(l.id)}</span>
        <div class="lore-vote-btns">
          <button class="kiss-btn" onclick="voteLore('${l.id}','kiss')">♥ ${l.kiss}</button>
          <button class="kick-btn" onclick="voteLore('${l.id}','kick')">✖ ${l.kick}</button>
        </div>
      </div>
    </div>`;
}

// ---------- ACTIONS ----------
async function submitEval(roll) {
  const form = document.getElementById('evalForm');
  if (!form) return;
  const student = STATE.students.find(x => x.roll === roll);
  const data = {};
  form.querySelectorAll('.star-input').forEach(inp => { data[inp.dataset.target] = inp.dataset.value || 3; });
  data.roll = roll;
  data.name = student ? student.name : '';
  data.lore = document.getElementById('evalLore').value.trim();

  const btn = form.querySelector('button.green');
  const overlay = document.getElementById('submitOverlay');
  if (btn) { btn.classList.add('loading'); btn.textContent = 'SUBMITTING...'; }
  if (overlay) overlay.classList.add('show');

  const t0 = Date.now();

  try {
    const res = await api('submiteval', data, 25000);
    if (res.error) throw new Error(res.error);

    const elapsed = Date.now() - t0;
    if (elapsed < 700) await new Promise(r => setTimeout(r, 700 - elapsed));
    if (overlay) overlay.classList.remove('show');

    let oldRating = null;
    if (res.updated) {
      const idx = STATE.students.findIndex(s => s.roll === roll);
      if (idx >= 0) {
        oldRating = STATE.students[idx].rating;
        STATE.students[idx] = res.updated;
      }
      STATE.swipeOrder = STATE.swipeOrder.map(s => s.roll === roll ? res.updated : s);

      if (STATE.currentDetail) {
        STATE.currentDetail.student = res.updated;
        const newEntry = {
          time: new Date(),
          personality: Number(data.personality),
          cool: Number(data.cool),
          helpfulness: Number(data.helpfulness),
          pettiness: Number(data.pettiness),
          hate: Number(data.hate),
          annoying: Number(data.annoying),
          score: res.score,
          lore: data.lore
        };
        STATE.currentDetail.entries = [newEntry, ...STATE.currentDetail.entries];
      }
      cWrite('roster', STATE.students);
      if (STATE.currentDetail) cWrite('detail_' + roll, STATE.currentDetail);
    }

    try { localStorage.removeItem(CK + 'leader'); } catch(_){}

    render();

    const bigScore = document.querySelector('.big-score');
    if (bigScore) {
      bigScore.classList.add('updated');
      setTimeout(() => bigScore.classList.remove('updated'), 800);
    }

    if (oldRating !== null && res.updated) {
      const delta = res.updated.rating - oldRating;
      const sign = delta >= 0 ? '+' : '';
      toast(`SCORED ${res.score.toFixed(2)} · RATING ${oldRating.toFixed(2)} → ${res.updated.rating.toFixed(2)} (${sign}${delta.toFixed(2)})`);
    } else {
      toast(`SCORED ${res.score.toFixed(2)}`);
    }
  } catch (err) {
    if (overlay) overlay.classList.remove('show');
    if (btn) { btn.classList.remove('loading'); btn.textContent = '▶ SUBMIT EVALUATION'; }
    toast('FAILED: ' + err.message, true);
  }
}

async function addLore(roll, name) {
  const text = document.getElementById('loreInput').value.trim();
  if (!text) { toast('WRITE SOMETHING FIRST', true); return; }
  try {
    const res = await api('addLore', { roll, name, text });
    if (res.error) throw new Error(res.error);
    document.getElementById('loreInput').value = '';
    toast('LORE ADDED');
    try { localStorage.removeItem(CK + 'detail_' + roll); } catch(_){}
    const d = await api('detail', { roll });
    STATE.currentDetail = d;
    cWrite('detail_' + roll, d);
    render();
  } catch (err) { toast('FAILED: ' + err.message, true); }
}

async function voteLore(loreId, vote) {
  try {
    const res = await api('voteLore', { loreId, vote });
    if (res.error) throw new Error(res.error);
    toast(vote === 'kiss' ? '♥ KISSED' : '✖ KICKED');
    const roll = STATE.currentStudent;
    try { localStorage.removeItem(CK + 'detail_' + roll); } catch(_){}
    const d = await api('detail', { roll });
    STATE.currentDetail = d;
    cWrite('detail_' + roll, d);
    render();
  } catch (err) { toast('FAILED: ' + err.message, true); }
}

async function sendKiss(roll) {
  const s = STATE.students.find(x => x.roll === roll);
  if (s) s.kisses++;
  if (STATE.currentDetail?.student?.roll === roll) STATE.currentDetail.student.kisses++;
  cWrite('roster', STATE.students);
  render();
  try { await api('kiss', { roll }); toast('♥ KISS SENT'); }
  catch { toast('NOT SAVED', true); }
}

async function sendKick(roll) {
  const s = STATE.students.find(x => x.roll === roll);
  if (s) s.kicks++;
  if (STATE.currentDetail?.student?.roll === roll) STATE.currentDetail.student.kicks++;
  cWrite('roster', STATE.students);
  render();
  try { await api('kick', { roll }); toast('✖ KICK SENT'); }
  catch { toast('NOT SAVED', true); }
}

// ---------- SWIPE ----------
function renderSwipe(el) {
  if (!STATE.swipeOrder.length) {
    el.innerHTML = `<div class="empty">NO PROFILES TO SWIPE.</div>`;
    return;
  }
  const total = STATE.swipeOrder.length;
  const idx = STATE.swipeIndex;
  if (idx >= total) {
    el.innerHTML = `
      <div class="pixel-box" style="text-align:center;padding:40px;">
        <div style="font-size:14px;color:var(--green);margin-bottom:12px;">DECK CLEARED</div>
        <div style="font-size:8px;color:var(--dim);margin-bottom:20px;">You saw all ${total} profiles.</div>
        <button class="pixel-btn green wide" onclick="resetSwipe()">▶ RESHUFFLE</button>
      </div>`;
    return;
  }
  const s = STATE.swipeOrder[idx];
  const cls = s.rating > 3 ? 'var(--green)' : s.rating < 2 ? 'var(--red)' : 'var(--yellow)';
  const pct = Math.round((idx / total) * 100);

  el.innerHTML = `
    <div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:7px;color:var(--dim);margin-bottom:6px;">
        <span>CARD ${idx + 1} / ${total}</span><span>${pct}%</span>
      </div>
      <div style="height:8px;background:var(--surface2);border:2px solid var(--border);">
        <div style="height:100%;width:${pct}%;background:var(--green);"></div>
      </div>
    </div>

    <div class="swipe-container" id="swipeContainer">
      <div class="swipe-overlay kiss" id="overlayKiss">KISS</div>
      <div class="swipe-overlay kick" id="overlayKick">KICK</div>
      <div class="swipe-card" id="swipeCard">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-roll">${esc(s.roll)}</div>
        <div class="sc-score" style="color:${cls}">${s.rating.toFixed(2)}</div>
        <div class="sc-kk"><span>♥ ${s.kisses}</span><span>✖ ${s.kicks}</span></div>
        <div class="sc-criteria">
          <div class="sc-crit" style="color:var(--green)"><span>PERSONALITY</span><span>${s.personality.toFixed(1)}</span></div>
          <div class="sc-crit" style="color:var(--green)"><span>COOL</span><span>${s.cool.toFixed(1)}</span></div>
          <div class="sc-crit" style="color:var(--green)"><span>HELPFUL</span><span>${s.helpfulness.toFixed(1)}</span></div>
          <div class="sc-crit" style="color:var(--red)"><span>PETTY</span><span>${s.pettiness.toFixed(1)}</span></div>
          <div class="sc-crit" style="color:var(--red)"><span>HATE</span><span>${s.hate.toFixed(1)}</span></div>
          <div class="sc-crit" style="color:var(--red)"><span>ANNOY</span><span>${s.annoying.toFixed(1)}</span></div>
        </div>
      </div>
    </div>

    <div class="swipe-hint">DRAG · ← → ARROWS · SPACE = SKIP</div>

    <div class="swipe-actions">
      <button class="pixel-btn pink" onclick="doSwipe('kiss')">♥ KISS</button>
      <button class="pixel-btn yellow" onclick="skipSwipe()">SKIP</button>
      <button class="pixel-btn red" onclick="doSwipe('kick')">✖ KICK</button>
    </div>

    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="pixel-btn" style="flex:1;" ${idx === 0 ? 'disabled' : ''} onclick="prevSwipe()">← PREV</button>
      <button class="pixel-btn" style="flex:1;" ${idx >= total - 1 ? 'disabled' : ''} onclick="nextSwipe()">NEXT →</button>
    </div>
  `;
  initSwipeDrag();
}

function initSwipeDrag() {
  const card = document.getElementById('swipeCard');
  if (!card) return;
  const kissOv = document.getElementById('overlayKiss');
  const kickOv = document.getElementById('overlayKick');
  let sx = 0, cx = 0, drag = false;

  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    sx = e.clientX; cx = 0; drag = true;
    card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch(_){}
  });
  card.addEventListener('pointermove', e => {
    if (!drag) return;
    cx = e.clientX - sx;
    card.style.transform = `translateX(${cx}px) rotate(${cx * 0.06}deg)`;
    const p = Math.min(Math.abs(cx) / 120, 1);
    if (cx > 0) { kissOv.style.opacity = p; kickOv.style.opacity = 0; }
    else        { kickOv.style.opacity = p; kissOv.style.opacity = 0; }
  });
  function end() {
    if (!drag) return;
    drag = false;
    if (cx > 100)       doSwipe('kiss');
    else if (cx < -100) doSwipe('kick');
    else {
      card.style.transition = 'transform 0.2s';
      card.style.transform = '';
      kissOv.style.opacity = 0; kickOv.style.opacity = 0;
    }
    cx = 0;
  }
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
  card.addEventListener('pointerleave', end);
}

function doSwipe(direction) {
  const s = STATE.swipeOrder[STATE.swipeIndex];
  if (!s) return;
  if (direction === 'kiss') sendKiss(s.roll);
  else if (direction === 'kick') sendKick(s.roll);
  animateOut(direction, () => { STATE.swipeIndex++; render(); });
}
function skipSwipe() { animateOut('skip', () => { STATE.swipeIndex++; render(); }); }
function prevSwipe() { if (STATE.swipeIndex > 0) { STATE.swipeIndex--; render(); } }
function nextSwipe() { if (STATE.swipeIndex < STATE.swipeOrder.length - 1) { STATE.swipeIndex++; render(); } }
function resetSwipe() { STATE.swipeOrder = shuffle([...STATE.students]); STATE.swipeIndex = 0; render(); }

function animateOut(d, cb) {
  const c = document.getElementById('swipeCard');
  if (!c) { cb(); return; }
  c.style.transition = 'transform 0.3s, opacity 0.3s';
  if (d === 'kiss')      c.style.transform = 'translateX(400px) rotate(30deg)';
  else if (d === 'kick') c.style.transform = 'translateX(-400px) rotate(-30deg)';
  else                   c.style.transform = 'translateY(-400px)';
  c.style.opacity = '0';
  setTimeout(cb, 320);
}

// ---------- UTILS ----------
function formatDate(v) {
  if (!v) return '—';
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v).slice(0, 16);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch { return String(v).slice(0, 16); }
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let toastTimer;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'error show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 4000);
}

// ---------- EVENTS ----------
document.getElementById('nav').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') {
    const tab = e.target.dataset.tab;
    if (tab === STATE.currentTab) return;
    STATE.currentTab = tab;
    STATE.currentStudent = null;
    STATE.currentDetail = null;
    STATE.detailError = null;
    render();
  }
});

document.getElementById('brand').addEventListener('click', goHome);

document.addEventListener('keydown', e => {
  if (STATE.currentTab !== 'swipe' || STATE.loading) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight')      { e.preventDefault(); doSwipe('kiss'); }
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); doSwipe('kick'); }
  else if (e.key === ' ')          { e.preventDefault(); skipSwipe(); }
  else if (e.key === 'ArrowDown')  { e.preventDefault(); nextSwipe(); }
  else if (e.key === 'ArrowUp')    { e.preventDefault(); prevSwipe(); }
});

// ---------- BOOT ----------
fetch(API_URL + '?action=ping&_t=' + Date.now(), { cache: 'no-store' }).catch(() => {});
boot();
</script>
